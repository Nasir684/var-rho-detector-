name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Find and fix project
        run: |
          find . -name "pubspec.yaml" -exec echo Found at {} \;
          PUB=$(find . -name "pubspec.yaml" | head -1)
          DIR=$(dirname $PUB)
          echo "Project at $DIR"
          echo "DIR=$DIR" >> $GITHUB_ENV
          ls -R
      - name: Get packages
        run: |
          cd $DIR
          flutter pub get
      - name: Build release APK
        run: |
          cd $DIR
          flutter build apk --release -v
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: Var-Rho-APK
          path: |
            **/app-release.apk
            **/app-*.apk
