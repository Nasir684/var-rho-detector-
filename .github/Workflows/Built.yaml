name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Build APK
        run: |
          PUB=$(find . -type f -name "pubspec.yaml" | head -1)
          echo "Found $PUB"
          DIR=$(dirname "$PUB")
          cd "$DIR"
          pwd
          ls -la
          # If android folder missing, create it without deleting your code
          if [ ! -d "android" ]; then
            flutter create . --org com.example --project-name var_rho_detector --platforms android --no-overwrite
          fi
          flutter pub get
          flutter build apk --release --verbose
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Var-Rho-APK
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/*.apk
          if-no-files-found: warn
