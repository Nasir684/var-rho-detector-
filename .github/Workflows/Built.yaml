name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Fix project structure
        run: |
          PUB=$(find . -name "pubspec.yaml" | head -1)
          DIR=$(dirname $PUB)
          cd $DIR
          echo "Fixing in $DIR"
          # Create android/ios if missing
          if [ ! -d "android" ]; then
            flutter create . --project-name var_rho_detector --org com.example --platforms=android
          fi
          flutter pub get
          echo "DIR=$DIR" >> $GITHUB_ENV
      - name: Build
        run: |
          cd $DIR
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: Var-Rho-APK
          path: ${{ env.DIR }}/build/app/outputs/flutter-apk/app-release.apk
