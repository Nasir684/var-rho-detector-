name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Build APK
        run: |
          echo "Finding pubspec..."
          find . -type f -name "pubspec.yaml" | head -20
          PUB=$(find . -type f -name "pubspec.yaml" | head -1)
          echo "FOUND: $PUB"
          DIR=$(dirname "$PUB")
          echo "DIR: $DIR"
          cd "$DIR"
          pwd
          ls -la
          if [ ! -d "android" ]; then
            flutter create . --org com.example --project-name var_rho_detector --platforms android --no-overwrite
          fi
                    flutter pub get
          flutter build apk --release
          flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Var-Rho-APK-Fixed
          path: |
            **/build/app/outputs/flutter-apk/*.apk
