name: Build Var-Rho APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      
      - name: Create COMPLETE working project
        run: |
          rm -rf lib android
          mkdir -p lib/categories
          
          # 1. pubspec.yaml
          cat > pubspec.yaml << 'EOF'
          name: var_rho_detector
          description: Var Rho EMI Detector
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sensors_plus: ^4.0.2
          flutter:
            uses-material-design: true
          EOF

          # 2. Var-Rho Engine (core logic - always works)
          cat > lib/var_rho_engine.dart << 'EOF'
          import 'dart:math';
          class VarRhoEngine {
            static Map<String, dynamic> analyze(List<double> x, List<double> y) {
              if (x.length < 5) return {'pass': false, 'Var': 0.0, 'Rho': 0.0};
              double meanX = x.reduce((a,b)=>a+b)/x.length;
              double meanY = y.reduce((a,b)=>a+b)/y.length;
              double varX = x.map((v)=>pow(v-meanX,2)).reduce((a,b)=>a+b)/x.length;
              double varY = y.map((v)=>pow(v-meanY,2)).reduce((a,b)=>a+b)/y.length;
              double v = (varX+varY);
              // Simple correlation
              double cov = 0; for(int i=0;i<x.length;i++){cov+=(x[i]-meanX)*(y[i]-meanY);}
              cov/=x.length;
              double rho = cov / (sqrt(varX*varY)+0.0001);
              bool pass = v > 15; // threshold for EMI
              String type = rho.abs() > 0.7 ? 'global EMI' : 'local EMI';
              return {'pass': pass, 'Var': v, 'Rho': rho, 'type': type};
            }
          }
          EOF

          # 3. Workshop Tool Screen (stub that compiles)
          cat > lib/categories/workshop_tool.dart << 'EOF'
          import 'package:flutter/material.dart';
          class WorkshopToolScreen extends StatelessWidget {
            @override Widget build(BuildContext context) {
              return Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                Icon(Icons.build, size: 80, color: Colors.orange),
                SizedBox(height: 20),
                Text("Workshop Mode", style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                Padding(padding: EdgeInsets.all(20), child: Text("Move near motor / power cable to detect EMI. Green = Clean, Red = EMI Detected", textAlign: TextAlign.center)),
              ]));
            }
          }
          EOF

          # 4. Student Lab Screen (stub that compiles)
          cat > lib/categories/student_lab.dart << 'EOF'
          import 'package:flutter/material.dart';
          class StudentLabScreen extends StatelessWidget {
            final List<Map<String,dynamic>> liveLog;
            StudentLabScreen({required this.liveLog});
            @override Widget build(BuildContext context) {
              return ListView.builder(
                itemCount: liveLog.length,
                itemBuilder: (c,i){
                  var e = liveLog[i];
                  return ListTile(
                    leading: Icon(Icons.bolt, color: Colors.red),
                    title: Text("${e['type']} - Var: ${e['Var'].toStringAsFixed(1)}"),
                    subtitle: Text("${e['time']} | Rho: ${e['Rho'].toStringAsFixed(2)}"),
                  );
                },
              );
            }
          }
          EOF

          # 5. Your Main File - CLEANED VERSION
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:sensors_plus/sensors_plus.dart';
          import 'var_rho_engine.dart';
          import 'categories/student_lab.dart';
          import 'categories/workshop_tool.dart';

          void main() => runApp(MaterialApp(home: VarRhoHome(), debugShowCheckedModeBanner: false));

          class VarRhoHome extends StatefulWidget { @override State<VarRhoHome> createState()=>_VarRhoHomeState(); }

          class _VarRhoHomeState extends State<VarRhoHome> {
            List<double> bufX=[], bufY=[];
            double liveVar=0, liveRho=0;
            String status="Clean — background";
            Color statusColor=Colors.green;
            List<Map<String,dynamic>> log=[];
            int categoryIndex=0;

            @override void initState(){
              super.initState();
              magnetometerEventStream(samplingPeriod: Duration(milliseconds: 20)).listen((e){
                bufX.add(e.x); bufY.add(e.y);
                if(bufX.length>=25){
                  final r = VarRhoEngine.analyze(bufX, bufY);
                  setState((){
                    liveVar = r['Var']; liveRho = r['Rho'];
                    if(r['pass']){
                      status = "EMI DETECTED: ${r['type']}";
                      statusColor = r['type'].toString().contains('global') ? Colors.red : Colors.orange;
                      log.insert(0, {'time': DateTime.now().toString().substring(11,19), ...r});
                      if(log.length>50) log.removeLast();
                    } else {
                      status = "Clean — Var ${liveVar.toStringAsFixed(0)}";
                      statusColor = Colors.green;
                    }
                  });
                  bufX.clear(); bufY.clear();
                }
              });
            }

            Widget getScreen(){
              switch(categoryIndex){
                case 2: return StudentLabScreen(liveLog: log);
                default: return WorkshopToolScreen();
              }
            }

            @override Widget build(BuildContext ctx){
              return Scaffold(
                appBar: AppBar(title: Text("Var-Rho EMI Detector"), backgroundColor: Colors.black87),
                body: Column(children: [
                  Container(color: statusColor, width: double.infinity, padding: EdgeInsets.all(10), child: Text(status, style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold))),
                  Container(height: 60, child: ListView(scrollDirection: Axis.horizontal, children: [
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Home FREE"), selected: categoryIndex==0, onSelected: (_)=>setState(()=>categoryIndex=0))),
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Workshop \$1.99"), selected: categoryIndex==1, onSelected: (_)=>setState(()=>categoryIndex=1))),
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Student Lab"), selected: categoryIndex==2, onSelected: (_)=>setState(()=>categoryIndex=2))),
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Hidden Device"), selected: categoryIndex==3, onSelected: (_)=>setState(()=>categoryIndex=3))),
                  ])),
                  Expanded(child: getScreen()),
                ]),
              );
            }
          }
          EOF

          flutter create . --org com.varrho.detector --project-name var_rho_detector --platforms android
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Var-Rho-FINAL-REAL
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
