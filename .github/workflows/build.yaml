name: Build Var-Rho by Nasir Khan FINAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Build Professional by Nasir Khan
        run: |
          rm -rf lib android
          mkdir -p lib/categories
          cat > pubspec.yaml << 'EOF'
          name: var_rho_detector
          description: Var-Rho EMI Detector - Professional Workshop & Lab Tool by Nasir Khan, Wana Lab
          publish_to: 'none'
          version: 3.1.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sensors_plus: ^4.0.2
            fl_chart: ^0.68.0
            share_plus: ^7.2.1
          flutter:
            uses-material-design: true
          EOF

          cat > lib/var_rho_engine.dart << 'EOF'
          import 'dart:math';
          class VarRhoEngine {
            static double calibX=0, calibY=0;
            static void calibrate(double x, double y){ calibX=x; calibY=y; }
            static Map<String, dynamic> analyze(List<double> x, List<double> y) {
              if (x.length < 5) return {'pass': false, 'Var': 0.0, 'Rho': 0.0, 'type': 'clean', 'mag':0};
              List<double> cx = x.map((v)=>v-calibX).toList();
              List<double> cy = y.map((v)=>v-calibY).toList();
              double mx = cx.reduce((a,b)=>a+b)/cx.length;
              double my = cy.reduce((a,b)=>a+b)/cy.length;
              double vx = cx.map((v)=>pow(v-mx,2)).reduce((a,b)=>a+b)/cx.length;
              double vy = cy.map((v)=>pow(v-my,2)).reduce((a,b)=>a+b)/cy.length;
              double v = vx+vy;
              double cov=0; for(int i=0;i<cx.length;i++){cov+=(cx[i]-mx)*(cy[i]-my);} cov/=cx.length;
              double rho = cov / (sqrt(vx*vy)+0.001);
              double mag = sqrt(mx*mx+my*my);
              bool pass = v > 8;
              String type = v>80 ? 'Strong EMI - Motor/Live Wire' : v>25 ? 'Moderate EMI - Electronics' : v>8 ? 'Weak EMI - Possible Device' : 'Clean';
              return {'pass': pass, 'Var': v, 'Rho': rho, 'type': type, 'mag': mag};
            }
          }
          EOF

          cat > lib/categories/workshop_tool.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:fl_chart/fl_chart.dart';
          class WorkshopToolScreen extends StatelessWidget {
            final double varValue; final double rhoValue; final List<double> history; final double threshold; final Function(double) onThreshold; final VoidCallback onCalibrate;
            WorkshopToolScreen({required this.varValue, required this.rhoValue, required this.history, required this.threshold, required this.onThreshold, required this.onCalibrate});
            @override Widget build(BuildContext c){
              return ListView(padding: EdgeInsets.all(12), children: [
                Card(child: Padding(padding: EdgeInsets.all(12), child: Column(children: [
                  Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Text("Sensitivity: ${threshold.toStringAsFixed(0)}", style: TextStyle(fontWeight: FontWeight.bold)), ElevatedButton.icon(onPressed: onCalibrate, icon: Icon(Icons.tune), label: Text("Calibrate Zero"))]),
                  Slider(value: threshold, min: 5, max: 100, divisions: 19, label: threshold.toStringAsFixed(0), onChanged: onThreshold),
                  Text("Lower = more sensitive. Calibrate in clean area away from motors.", style: TextStyle(fontSize: 11, color: Colors.grey)),
                ]))),
                Card(child: ListTile(leading: Icon(Icons.speed, color: Colors.deepPurple), title: Text("Var: ${varValue.toStringAsFixed(1)} | Mag: ${(varValue*2).toStringAsFixed(1)} µT"), subtitle: Text("Rho: ${rhoValue.toStringAsFixed(2)} - correlation X/Y"))),
                if(history.length>2) Card(child: Container(height: 120, padding: EdgeInsets.all(8), child: LineChart(LineChartData(gridData: FlGridData(show: false), titlesData: FlTitlesData(show: false), borderData: FlBorderData(show: false), lineBarsData: [LineChartBarData(spots: List.generate(history.length, (i)=>FlSpot(i.toDouble(), history[i])), isCurved: true, dotData: FlDotData(show: false), color: Colors.deepPurple, barWidth: 2)])))),
              ]);
            }
          }
          EOF

          cat > lib/categories/student_lab.dart << 'EOF'
          import 'package:flutter/material.dart';
          class StudentLabScreen extends StatelessWidget {
            final List<Map<String,dynamic>> liveLog;
            final VoidCallback onExport;
            StudentLabScreen({required this.liveLog, required this.onExport});
            @override Widget build(BuildContext c){
              return Column(children: [
                Padding(padding: EdgeInsets.all(8), child: Row(children: [Expanded(child: Text("Logs: ${liveLog.length} records", style: TextStyle(fontWeight: FontWeight.bold))), ElevatedButton.icon(onPressed: liveLog.isEmpty?null:onExport, icon: Icon(Icons.share), label: Text("Export CSV"))])),
                Expanded(child: ListView.builder(itemCount: liveLog.length, itemBuilder: (ctx,i){var e=liveLog[i]; Color col = e['Var']>80?Colors.red:e['Var']>25?Colors.orange:Colors.blueGrey; return Card(child: ListTile(dense: true, leading: Icon(Icons.bolt, color: col), title: Text("${e['type']}", style: TextStyle(fontSize: 13)), subtitle: Text("${e['time']} | Var ${e['Var'].toStringAsFixed(1)} Rho ${e['Rho'].toStringAsFixed(2)}")));})),
              ]);
            }
          }
          class HiddenDeviceScreen extends StatelessWidget {
            @override Widget build(BuildContext c){
              return ListView(padding: EdgeInsets.all(16), children: [
                Card(color: Colors.red.shade50, child: Padding(padding: EdgeInsets.all(16), child: Column(children: [
                  Icon(Icons.radar, size: 56, color: Colors.red), SizedBox(height:12),
                  Text("Hidden Electronics & Wiring Finder", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold), textAlign: TextAlign.center),
                  SizedBox(height:8),
                  Text("Detects magnetic anomalies from ACTIVE electronics, live wires behind walls, and some wireless devices.", textAlign: TextAlign.center, style: TextStyle(fontSize: 13)),
                  SizedBox(height:10),
                  Container(padding: EdgeInsets.all(10), color: Colors.white, child: Text("How to scan:\n• Calibrate in clean area\n• Move 5-10cm from surface slowly\n• Watch Var spike + RED\n• Does NOT guarantee detection if OFF/shielded", style: TextStyle(fontSize: 12))),
                ]))),
              ]);
            }
          }
          EOF

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:sensors_plus/sensors_plus.dart';
          import 'package:share_plus/share_plus.dart';
          import 'var_rho_engine.dart';
          import 'categories/student_lab.dart';
          import 'categories/workshop_tool.dart';

          void main() => runApp(MaterialApp(home: VarRhoHome(), debugShowCheckedModeBanner: false, theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.deepPurple)));

          class VarRhoHome extends StatefulWidget { @override State<VarRhoHome> createState()=>_VarRhoHomeState(); }

          class _VarRhoHomeState extends State<VarRhoHome> {
            List<double> bufX=[], bufY=[], historyVar=[];
            double liveVar=0, liveRho=0, liveMag=0; String status="Clean — background"; Color statusColor=Colors.green;
            List<Map<String,dynamic>> log=[]; int categoryIndex=0; double threshold=15;
            double lastX=0, lastY=0;

            @override void initState(){
              super.initState();
              magnetometerEventStream(samplingPeriod: Duration(milliseconds: 30)).listen((e){
                lastX=e.x; lastY=e.y;
                bufX.add(e.x); bufY.add(e.y);
                if(bufX.length>=20){
                  final r = VarRhoEngine.analyze(bufX, bufY);
                  setState((){
                    liveVar=r['Var']; liveRho=r['Rho']; liveMag=r['mag']; historyVar.add(liveVar); if(historyVar.length>40) historyVar.removeAt(0);
                    if(r['pass'] && liveVar>threshold){
                      status="${r['type']} | Var ${liveVar.toStringAsFixed(0)}"; statusColor = liveVar>80?Colors.red:Colors.orange;
                      log.insert(0, {'time': DateTime.now().toString().substring(11,19), ...r});
                    } else { status="Clean — Var ${liveVar.toStringAsFixed(1)} Rho ${liveRho.toStringAsFixed(2)}"; statusColor=Colors.green; }
                  });
                  bufX.clear(); bufY.clear();
                }
              });
            }

            void exportCSV(){ String csv="Time,Var,Rho,Mag,Type\n"; for(var e in log){ csv+="${e['time']},${e['Var']},${e['Rho']},${e['mag']},${e['type']}\n"; } Share.share(csv, subject: "Var-Rho Log by Nasir Khan - Wana Lab"); }

            @override Widget build(BuildContext ctx){
              return Scaffold(
                appBar: AppBar(title: Text("Var-Rho v3.1 - Wana Lab"), backgroundColor: Colors.black, foregroundColor: Colors.white, actions: [
                  IconButton(icon: Icon(Icons.person), onPressed: ()=>showDialog(context: ctx, builder: (_)=>AlertDialog(
                    title: Text("About Developer"),
                    content: SingleChildScrollView(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text("Nasir Khan", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                      Text("Founder - Wana Lab", style: TextStyle(color: Colors.deepPurple, fontWeight: FontWeight.bold)),
                      Text("Email: Njwazir@gmail.com\nLocation: Wana, South Waziristan, Pakistan\n\n", style: TextStyle(fontSize: 12)),
                      Text("Scientific Background:", style: TextStyle(fontWeight: FontWeight.bold)),
                      Text("• Research in EMI/EMF detection using smartphone magnetometer sensors\n• Developer of Var-Rho theory: Using Variance (Var) and Correlation (Rho) to classify electromagnetic interference\n• Open-source development on GitHub - building professional tools for labs, workshops and students\n• Focus: Low-cost, accurate EMI detection without expensive hardware\n• Tested with motors, live wires, power supplies and electronic devices\n\nThis app is designed for:\n✓ Electrical workshops - find live wires before drilling\n✓ Student labs - learn Var, Rho, magnetic field analysis\n✓ Field engineers - quick EMI check\n✓ Electronics diagnostics\n\nVersion: 3.1 Professional\nPackage: com.wanalab.varrho\nGitHub: Open development, continuous improvement\nContact for collaboration: Njwazir@gmail.com", style: TextStyle(fontSize: 12)),
                    ])),
                    actions: [TextButton(onPressed: ()=>Navigator.pop(ctx), child: Text("Close"))],
                  ))),
                ]),
                body: Column(children: [
                  AnimatedContainer(duration: Duration(milliseconds: 250), color: statusColor, width: double.infinity, padding: EdgeInsets.symmetric(vertical: 14, horizontal: 16), child: Text(status, style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold))),
                  Container(height: 56, color: Colors.grey.shade100, child: ListView(scrollDirection: Axis.horizontal, padding: EdgeInsets.symmetric(horizontal: 8), children: [
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Home FREE"), selected: categoryIndex==0, onSelected: (_)=>setState(()=>categoryIndex=0))),
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Workshop PRO"), selected: categoryIndex==1, onSelected: (_)=>setState(()=>categoryIndex=1))),
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Student Lab"), selected: categoryIndex==2, onSelected: (_)=>setState(()=>categoryIndex=2))),
                    Padding(padding: EdgeInsets.all(6), child: ChoiceChip(label: Text("Hidden Finder"), selected: categoryIndex==3, onSelected: (_)=>setState(()=>categoryIndex=3))),
                  ])),
                  Expanded(child: Builder(builder: (_){
                    switch(categoryIndex){
                      case 0: return WorkshopToolScreen(varValue: liveVar, rhoValue: liveRho, history: historyVar, threshold: threshold, onThreshold: (v)=>setState(()=>threshold=v), onCalibrate: ()=>VarRhoEngine.calibrate(lastX, lastY));
                      case 1: return WorkshopToolScreen(varValue: liveVar, rhoValue: liveRho, history: historyVar, threshold: threshold, onThreshold: (v)=>setState(()=>threshold=v), onCalibrate: ()=>VarRhoEngine.calibrate(lastX, lastY));
                      case 2: return StudentLabScreen(liveLog: log, onExport: exportCSV);
                      case 3: return HiddenDeviceScreen();
                      default: return WorkshopToolScreen(varValue: liveVar, rhoValue: liveRho, history: historyVar, threshold: threshold, onThreshold: (v)=>setState(()=>threshold=v), onCalibrate: ()=>VarRhoEngine.calibrate(lastX, lastY));
                    }
                  })),
                  Container(color: Colors.black12, padding: EdgeInsets.all(4), child: Row(mainAxisAlignment: MainAxisAlignment.center, children: [Text("Developed by Nasir Khan | Wana Lab | Njwazir@gmail.com", style: TextStyle(fontSize: 10, color: Colors.black54))])),
                ]),
              );
            }
          }
          EOF

          flutter create . --org com.wanalab.varrho --project-name var_rho_detector --platforms android
          flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: Var-Rho-NasirKhan-WanaLab-FINAL
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/bundle/release/*.aab
